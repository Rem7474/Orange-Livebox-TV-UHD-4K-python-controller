name: CI - Tests & Build Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Exécution des tests unitaires
        run: |
          pytest -v tests/

  build-check:
    name: Build Smoke Test (Windows)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Installation des dépendances de build
        run: |
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Compilation de l'exécutable PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "LiveboxTVController" --icon "app_icon.ico" --add-data "keys.json;." --add-data "epg_ids.json;." tvOrangeGui.py

      - name: Vérification de la présence du binaire
        run: |
          if (-not (Test-Path "dist\LiveboxTVController.exe")) {
            throw "Le fichier dist\LiveboxTVController.exe n'a pas été généré !"
          }
          $item = Get-Item "dist\LiveboxTVController.exe"
          Write-Output "Binaire généré avec succès : $($item.Length) octets"

      - name: Sauvegarde de l'artefact de test
        uses: actions/upload-artifact@v4
        with:
          name: LiveboxTVController-CI-Build
          path: dist/LiveboxTVController.exe
          retention-days: 7

  flutter-test:
    name: Flutter Mobile Tests & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Installation des dépendances Flutter
        run: |
          cd android_app
          flutter pub get

      - name: Vérification du formatage Dart
        run: |
          cd android_app
          dart format --set-exit-if-changed .

      - name: Analyse statique du code Dart
        run: |
          cd android_app
          flutter analyze

      - name: Exécution des tests unitaires mobiles (avec couverture)
        run: |
          cd android_app
          flutter test --coverage

      - name: Sauvegarde du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-lcov
          path: android_app/coverage/lcov.info
          retention-days: 7

      - name: Build APK de vérification (sans signing release)
        run: |
          cd android_app
          flutter build apk --release

      - name: Build AAB de vérification (format requis pour le Play Store)
        run: |
          cd android_app
          flutter build appbundle --release

