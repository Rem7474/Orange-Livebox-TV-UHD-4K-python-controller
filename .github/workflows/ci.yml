name: CI - Tests & Build Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Exécution des tests unitaires
        run: |
          pytest -v tests/

  build-check:
    name: Build Smoke Test (Windows)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Installation des dépendances de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compilation de l'exécutable PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "LiveboxTVController" --add-data "keys.json;." --add-data "epg_ids.json;." tvOrangeGui.py

      - name: Vérification de la présence du binaire
        run: |
          if (-not (Test-Path "dist\LiveboxTVController.exe")) {
            throw "Le fichier dist\LiveboxTVController.exe n'a pas été généré !"
          }
          $item = Get-Item "dist\LiveboxTVController.exe"
          Write-Output "Binaire généré avec succès : $($item.Length) octets"

      - name: Sauvegarde de l'artefact de test
        uses: actions/upload-artifact@v4
        with:
          name: LiveboxTVController-CI-Build
          path: dist/LiveboxTVController.exe
          retention-days: 7
