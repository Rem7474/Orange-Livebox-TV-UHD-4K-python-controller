name: Release - Build & Publish Desktop & Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag de version (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Validation par les tests unitaires
        run: |
          pytest -v tests/

      - name: Compilation de l'exécutable autonome (.exe)
        run: |
          pyinstaller --noconsole --onefile --name "LiveboxTVController" --icon "app_icon.ico" --add-data "keys.json;." --add-data "epg_ids.json;." tvOrangeGui.py

      - name: Génération de l'empreinte SHA-256
        run: |
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 "LiveboxTVController.exe").Hash
          "$hash *LiveboxTVController.exe" | Out-File -Encoding ascii "LiveboxTVController.exe.sha256"
          Write-Output "SHA256: $hash"
          cd ..

      - name: Publication de la Release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LiveboxTVController.exe
            dist/LiveboxTVController.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Build & Release Android APK & AAB
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérification du keystore de signature Release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Les secrets/variables de signature Android Release (ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_KEY_PASSWORD) sont requis pour publier une release."
            exit 1
          fi

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Décodage du keystore de signature Release
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/livebox-release.jks"

      - name: Compilation de l'APK et de l'AAB Android Release
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ format('{0}/livebox-release.jks', runner.temp) }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          BUILD_NAME="${TAG_NAME#v}"
          BUILD_NUMBER="${{ github.run_number }}"
          cd android_app
          flutter pub get
          flutter test
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk ../TelecommandeTVOrange.apk
          cp build/app/outputs/bundle/release/app-release.aab ../TelecommandeTVOrange.aab
          cd ..
          sha256sum TelecommandeTVOrange.apk > TelecommandeTVOrange.apk.sha256
          sha256sum TelecommandeTVOrange.aab > TelecommandeTVOrange.aab.sha256

      - name: Publication de l'APK et de l'AAB sur la Release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            TelecommandeTVOrange.apk
            TelecommandeTVOrange.apk.sha256
            TelecommandeTVOrange.aab
            TelecommandeTVOrange.aab.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows-flutter:
    name: Build & Release Windows Flutter Desktop
    needs: release
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Compilation Flutter Desktop (Windows)
        shell: pwsh
        run: |
          $buildName = $env:TAG_NAME -replace '^v', ''
          $buildNumber = "${{ github.run_number }}"
          cd android_app
          flutter create --platforms=windows --project-name android_app .
          Copy-Item ..\app_icon.ico windows\runner\resources\app_icon.ico -Force
          (Get-Content windows\runner\main.cpp -Raw) -replace 'android_app', 'Télécommande TV Orange' | Set-Content windows\runner\main.cpp -Encoding UTF8
          flutter pub get
          flutter build windows --release --build-name="$buildName" --build-number="$buildNumber"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ..\TelecommandeTVOrange-Windows.zip -Force
          cd ..
          $hash = (Get-FileHash -Algorithm SHA256 "TelecommandeTVOrange-Windows.zip").Hash
          "$hash *TelecommandeTVOrange-Windows.zip" | Out-File -Encoding ascii "TelecommandeTVOrange-Windows.zip.sha256"

      - name: Publication de l'app Windows Flutter sur la Release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            TelecommandeTVOrange-Windows.zip
            TelecommandeTVOrange-Windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

