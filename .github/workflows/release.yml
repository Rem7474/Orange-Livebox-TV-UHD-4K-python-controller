name: Release - Build & Publish Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag de version (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          pip install --only-binary :all: -r requirements-dev.txt

      - name: Validation par les tests unitaires
        run: |
          pytest -v tests/

      - name: Compilation de l'exécutable autonome (.exe)
        run: |
          pyinstaller --noconsole --onefile --name "LiveboxTVController" --icon "app_icon.ico" --add-data "keys.json;." --add-data "epg_ids.json;." tvOrangeGui.py

      - name: Génération de l'empreinte SHA-256
        run: |
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 "LiveboxTVController.exe").Hash
          "$hash *LiveboxTVController.exe" | Out-File -Encoding ascii "LiveboxTVController.exe.sha256"
          Write-Output "SHA256: $hash"
          cd ..

      - name: Publication de la Release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LiveboxTVController.exe
            dist/LiveboxTVController.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Build & Release Android APK
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Décodage du keystore de signature Release
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/livebox-release.jks"

      - name: Compilation de l'APK Android Release
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ env.HAS_RELEASE_KEYSTORE == 'true' && format('{0}/livebox-release.jks', runner.temp) || '' }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          cd android_app
          flutter pub get
          flutter test
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../LiveboxTVController.apk
          cd ..
          sha256sum LiveboxTVController.apk > LiveboxTVController.apk.sha256

      - name: Publication de l'APK sur la Release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            LiveboxTVController.apk
            LiveboxTVController.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

